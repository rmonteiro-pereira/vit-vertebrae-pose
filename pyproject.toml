[project]
name = "vitvert"
version = "1.0.0"
description = "An empirical benchmark of Vision Transformers for cervical-vertebra landmark localisation"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Rodrigo Monteiro Pereira" }]
keywords = ["vision-transformer", "keypoint-detection", "medical-imaging", "pose-estimation", "benchmark"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

# The analysis pipeline -- results, statistics, tables, figures -- runs on these alone.
# No GPU, no dataset, no network.
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Everything needed to actually train. Needs the licensed dataset; see docs/dataset.md.
train = [
    "pillow>=10.0",
    "torch>=2.2",
    "transformers>=4.44",
]
dev = [
    "mypy>=1.11",
    "pillow>=10.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[project.urls]
Documentation = "https://github.com/rmonteiro-pereira/vit-vertebrae-pose/tree/main/docs"
Source = "https://github.com/rmonteiro-pereira/vit-vertebrae-pose"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vitvert"]

# CPU wheels by default: this repository is about analysing archived results, and a
# reader should not download a CUDA runtime to run the test suite. Override the index
# when you actually train.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning:vitvert.*"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "scripts", "tests", "tools"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # builtin shadowing
    "C4",   # comprehensions
    "SIM",  # simplify
    "PTH",  # use pathlib
    "RUF",
    "BLE",  # no blind except
    "TRY",  # exception antipatterns
    "ARG",  # unused arguments
    "D",    # docstrings
]
ignore = [
    "D100",  # module docstring in every test file is noise
    "D104",
    "D107",  # __init__ documented on the class
    "D203",
    "D213",
    "TRY003",  # long messages inline are more useful than a bespoke exception per case
    "N812",    # `import torch.nn.functional as F` is the universal PyTorch convention
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D101", "D102", "D103", "ARG002"]
"scripts/*" = ["D103"]
"tools/*" = ["D103"]

[tool.ruff.format]
# Code blocks quoted in docs/ are verbatim excerpts of the original research code.
# Reformatting them would silently edit the evidence.
exclude = ["*.md"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Analysed against 3.12: numpy's bundled stubs use `type` statements that mypy only
# parses under 3.12+. Runtime support still starts at 3.11 and the test matrix covers it.
[tool.mypy]
python_version = "3.12"
files = ["src", "scripts", "tools"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
# Neither ships complete stubs; the boundary is narrow and covered by tests.
module = ["transformers.*", "matplotlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["vitvert.models.backbones", "vitvert.data.dataset", "vitvert.training", "scripts.train"]
# These construct HuggingFace models whose signatures are untyped upstream.
disallow_untyped_calls = false

[tool.coverage.run]
source = ["src/vitvert"]
branch = true
